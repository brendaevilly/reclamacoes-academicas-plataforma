<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notificações - Ouvidoria Universitária</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #050418;
      --bg-card: #07051e;
      --bg-border: #0e1127;
      --text-primary: #ffffff;
      --text-secondary: #cfcfcf;
      --text-muted: #9ba4b1;
      --accent: #16B4F2;
      --accent-soft: rgba(22, 180, 242, 0.12);
      --danger: #E63946;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--bg-border);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      color: var(--accent);
      font-size: 1.5rem;
      margin: 0;
      font-weight: 700;
    }

    .btn-voltar {
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-weight: 500;
      text-decoration: none;
    }

    .btn-voltar:hover {
      background-color: #119bd2;
      color: #fff;
    }

    .container-notif {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .notif-title {
      font-weight: 600;
      color: var(--accent);
      margin: 0;
    }

    .notif-actions {
      display: flex;
      gap: 8px;
    }

    .btn-acao {
      background-color: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-acao:hover {
      background-color: var(--accent);
      color: #fff;
    }

    .btn-acao:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .notif-filtros {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filtro-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--bg-border);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .filtro-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filtro-btn.active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .notificacao {
      background-color: var(--bg-card);
      border: 1px solid var(--bg-border);
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 12px;
      transition: 0.25s;
      cursor: pointer;
      position: relative;
    }

    .notificacao:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .notificacao.nao-lida {
      border-left: 4px solid var(--accent);
      background-color: var(--accent-soft);
    }

    .notificacao .badge-novo {
      background-color: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .notificacao h6 {
      margin: 0 0 6px 0;
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .notificacao p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .notificacao small {
      display: block;
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .notif-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .notif-empty .icone {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .tipo-label {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      background-color: var(--bg-border);
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tipo-label.novo_comentario {
      background-color: rgba(22, 180, 242, 0.2);
      color: var(--accent);
    }

    .tipo-label.resposta_universidade {
      background-color: rgba(76, 175, 80, 0.2);
      color: #81c784;
    }

    .tipo-label.nova_reclamacao {
      background-color: rgba(230, 57, 70, 0.2);
      color: #ef9a9a;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ouvidoria Universitária</h1>
    <a href="telaprincipal.html" class="btn-voltar">← Voltar</a>
  </header>

  <div class="container-notif">
    <div class="notif-header">
      <h4 class="notif-title">
        Notificações
        <span id="notif-counter" class="badge bg-secondary ms-2" style="font-size: 0.75rem;">0</span>
      </h4>
      <div class="notif-actions">
        <button class="btn-acao" id="btn-marcar-todas">Marcar todas como lidas</button>
      </div>
    </div>

    <div class="notif-filtros">
      <button class="filtro-btn active" data-filtro="todas">Todas</button>
      <button class="filtro-btn" data-filtro="nao-lidas">Não lidas</button>
      <button class="filtro-btn" data-filtro="lidas">Lidas</button>
    </div>

    <div id="notif-container">
      <div class="loading">Carregando notificações...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/api-config.js"></script>
  <script src="../scripts/notificacoes.js"></script>
</body>
</html>
