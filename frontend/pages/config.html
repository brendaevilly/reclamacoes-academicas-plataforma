<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configurações - Ouvidoria Universitária</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/design-system.css" />
  <link rel="stylesheet" href="../styles/page-layout.css" />
  <link rel="stylesheet" href="../styles/form-validation.css">
  <link rel="stylesheet" href="../styles/config.css" />
</head>

<body class="config-page">

  <header class="page-header d-flex justify-content-between align-items-center">
    <div class="app-logo">
      <span class="app-logo-mark">O</span>
      <span class="app-logo-text">Ouvidoria Universitária</span>
    </div>
    <a href="telaprincipal.html" class="btn btn-outline-secondary btn-sm">← Voltar</a>
  </header>

  <div class="container-config">
    <h4 class="mb-4 fw-bold">Configurações da Conta</h4>

    <form id="form-config" novalidate>
      <div class="mb-4">
        <h6 class="section-title">Informações de Perfil</h6>

        <div class="mb-3">
          <label class="form-label" for="nome-completo">Nome completo</label>
          <input type="text" class="form-control" id="nome-completo" name="nome-completo" placeholder="Seu nome completo" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email-usuario">E-mail</label>
          <input type="email" class="form-control" id="email-usuario" name="email-usuario" placeholder="exemplo@email.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label" for="universidade-usuario">Universidade</label>
          <input type="text" class="form-control" id="universidade-usuario" name="universidade-usuario" placeholder="Universidade Federal..." disabled>
        </div>
      </div>

      <div class="mb-4">
        <h6 class="section-title">Segurança</h6>
        <p class="text-muted small">Preencha apenas se deseja trocar a senha.</p>

        <div class="mb-3">
          <label class="form-label" for="senha-atual">Senha atual</label>
          <input type="password" class="form-control" id="senha-atual" name="senha-atual" placeholder="••••••••" autocomplete="current-password">
        </div>

        <div class="mb-3">
          <label class="form-label" for="nova-senha">Nova senha</label>
          <input type="password" class="form-control" id="nova-senha" name="nova-senha" placeholder="Nova senha" autocomplete="new-password">
        </div>

        <div class="mb-3">
          <label class="form-label" for="confirmar-senha">Confirmar nova senha</label>
          <input type="password" class="form-control" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua nova senha" autocomplete="new-password">
        </div>
      </div>

      <div class="text-end">
        <button type="submit" class="btn-salvar" id="btn-salvar">Salvar Alterações</button>
      </div>
    </form>
  </div>

  <footer>
    &copy; 2025 Ouvidoria Universitária — Todos os direitos reservados.
  </footer>

  <script src="../scripts/api-config.js"></script>
  <script src="../scripts/form-validation.js"></script>
  <script src="../scripts/config.js"></script>
</body>
</html>
