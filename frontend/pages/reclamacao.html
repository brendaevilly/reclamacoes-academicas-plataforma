<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ouvidoria Universitária - Adicionar Reclamação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/design-system.css" />
  <link rel="stylesheet" href="../styles/page-layout.css" />
  <link rel="stylesheet" href="../styles/form-validation.css">
  <link rel="stylesheet" href="../styles/reclamacao.css" />
</head>

<body class="reclamacao-page">
  <div class="reclamacao-form-container">
    <a href="telaprincipal.html" class="btn btn-secondary btn-back-page">&larr; Voltar</a>
    <h2 class="page-title">Adicionar Reclamação</h2>
    <p class="page-subtitle">Descreva sua reclamação e selecione a instituição e categoria adequadas.</p>
    <form id="form-reclamacao" novalidate>
      <div class="mb-3">
        <label for="titulo" class="form-label">Título da Reclamação</label>
        <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Digite o título" required>
      </div>
      <div class="mb-3">
        <label for="categoria" class="form-label">Categoria</label>
        <select class="form-select" id="categoria" name="categoria" required>
          <option value="">Selecione a categoria</option>
          <option value="infraestrutura">Infraestrutura</option>
          <option value="atendimento">Atendimento</option>
          <option value="ensino">Ensino</option>
          <option value="alimentacao">Alimentação</option>
          <option value="seguranca">Segurança</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="universidade" class="form-label">Instituição</label>
        <select class="form-select" id="universidade" name="universidade" required>
          <option value="">Carregando instituições...</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="campus" class="form-label">Campus</label>
        <select class="form-select" id="campus" name="campus" disabled required>
          <option value="">Selecione primeiro a instituição</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" name="descricao" rows="5" placeholder="Digite a sua reclamação" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Adicionar Reclamação</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/api-config.js"></script>
  <script src="../scripts/form-validation.js"></script>
  <script src="../scripts/reclamacao.js"></script>
</body>

</html>
