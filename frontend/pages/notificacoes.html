<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notificações - Ouvidoria Universitária</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/design-system.css" />
  <link rel="stylesheet" href="../styles/page-layout.css" />
  <link rel="stylesheet" href="../styles/notificacoes.css" />
</head>
<body class="notificacoes-page">

  <header class="page-header">
    <div class="app-logo">
      <span class="app-logo-mark">O</span>
      <span class="app-logo-text">Ouvidoria Universitária</span>
    </div>
    <a href="telaprincipal.html" class="btn-voltar">← Voltar</a>
  </header>

  <div class="container-notif">
    <div class="notif-header">
      <h4 class="notif-title">
        Notificações
        <span id="notif-counter" class="badge bg-secondary ms-2">0</span>
      </h4>
      <div class="notif-actions">
        <button class="btn-acao" id="btn-marcar-todas">Marcar todas como lidas</button>
      </div>
    </div>

    <div class="notif-filtros">
      <button class="filtro-btn active" data-filtro="todas">Todas</button>
      <button class="filtro-btn" data-filtro="nao-lidas">Não lidas</button>
      <button class="filtro-btn" data-filtro="lidas">Lidas</button>
    </div>

    <div id="notif-container">
      <div class="loading">Carregando notificações...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/api-config.js"></script>
  <script src="../scripts/notificacoes.js"></script>
</body>
</html>
