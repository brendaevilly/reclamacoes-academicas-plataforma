<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Universidade</title>
  <link rel="stylesheet" href="../styles/login.css" />
  <link rel="stylesheet" href="../styles/global.css">
</head>


<body>
  <main class="container-login">
    <section class="login-imagem">
      <img src="../assets/images/universidade.png" alt="Login Illustration">
    </section>

    <section class="login-formulario">
      <h2>LOGIN UNIVERSIDADE</h2>
      <form id="form-login-universidade">
        <div class="form-grupo-login">
          <label for="email">E-mail Institucional</label>
          <input type="email" id="email" placeholder="@mail.com" required />
        </div>

        <div class="form-grupo-login">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="********" required />
        </div>

        <button type="submit">Entrar</button>

        <p class="criar-conta">
          Não possui cadastro?
          <a href="cadastro-universidade.html">Cadastrar Universidade</a>
        </p>
        <p class="criar-conta mt-2">
          É um aluno?
          <a href="login.html">Acesse aqui</a>
        </p>

      </form>
    </section>
  </main>
  <script src="../scripts/login-universidade.js"></script>
</body>
</html>
