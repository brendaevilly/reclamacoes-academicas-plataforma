<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Universidade - Ouvidoria Universitária</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/design-system.css" />
    <link rel="stylesheet" href="../styles/page-layout.css" />
    <link rel="stylesheet" href="../styles/buscar-universidade.css" />
</head>

<body class="buscar-universidade-page">

    <header class="page-header d-flex justify-content-between align-items-center">
        <div class="app-logo">
            <span class="app-logo-mark">O</span>
            <span class="app-logo-text">Ouvidoria Universitária</span>
        </div>
        <a href="telaprincipal.html" class="btn btn-outline-secondary btn-sm">← Voltar</a>
    </header>

    <div class="container-busca">
        <div class="search-box">
            <h4 class="mb-3">Buscar Universidade</h4>

            <input 
                type="text"
                class="search-input"
                id="search-input"
                placeholder="Digite o nome, sigla ou campus..."
                autocomplete="off"
            >
        </div>

        <div class="results-container">
            <div id="results-container">
                <p class="no-results">Digite algo para buscar universidades...</p>
            </div>
        </div>
    </div>

    <script src="../scripts/api-config.js"></script>
    <script src="../scripts/buscar-universidade.js"></script>
</body>
</html>
