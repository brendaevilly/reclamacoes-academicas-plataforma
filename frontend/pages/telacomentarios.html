<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comentários - Falta de Ar-Condicionado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/design-system.css" />
  <link rel="stylesheet" href="../styles/page-layout.css" />
  <link rel="stylesheet" href="../styles/form-validation.css">
  <link rel="stylesheet" href="../styles/telacomentarios.css" />
</head>

<body class="comentarios-page">

  <header class="page-header d-flex justify-content-between align-items-center">
    <div class="app-logo">
      <span class="app-logo-mark">O</span>
      <span class="app-logo-text">Ouvidoria Universitária</span>
    </div>
    <div class="status-geral">Comentários da reclamação</div>
  </header>

  <main class="container my-4">

    <a href="telafeed.html" class="btn btn-voltar">← Voltar ao Feed</a>


    <div class="comentario-area">
      <h4 id="reclamacao-titulo">Carregando...</h4>
      <p class="text-muted" id="reclamacao-descricao">Carregando...</p>
    </div>


    <div class="comentario-area mt-4">
      <h5>Comentários</h5>
      <div id="comentarios-container">
        <p class="text-muted">Carregando comentários...</p>
      </div>
    </div>

    <div class="comentario-area mt-4" id="area-adicionar-comentario">
      <h5>Adicionar Comentário</h5>
      <form id="form-comentario" novalidate>
        <div class="mb-3">
          <textarea class="form-control" id="texto-comentario" name="texto-comentario" rows="3"
            placeholder="Digite seu comentário..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Comentar</button>
      </form>
    </div>


    <div class="nova-reclamacao" id="area-nova-reclamacao">
      <a href="reclamacao.html" class="btn btn-voltar">+ Adicionar Nova Reclamação</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/api-config.js"></script>
  <script src="../scripts/form-validation.js"></script>
  <script src="../scripts/comentarios.js"></script>
</body>

</html>
