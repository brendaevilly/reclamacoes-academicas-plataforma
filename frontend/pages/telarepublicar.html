<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Republicar Reclamação - Ouvidoria Universitária</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/design-system.css" />
  <link rel="stylesheet" href="../styles/page-layout.css" />
  <link rel="stylesheet" href="../styles/telarepublicar.css" />
</head>
<body class="page-app">
  <header class="page-header d-flex justify-content-between align-items-center">
    <div class="app-logo">
      <span class="app-logo-mark">O</span>
      <span class="app-logo-text">Ouvidoria Universitária</span>
    </div>
    <div class="status-geral">Plataforma ativa · 256 reclamações públicas</div>
  </header>

  <main class="container-form">
    <a href="telafeed.html" class="btn-back-page">← Voltar ao Feed</a>

    <h2>Republicar Reclamação</h2>

    <form id="form-republicar">
      <div class="mb-3">
        <label for="titulo" class="form-label">Título da Reclamação</label>
        <input type="text" class="form-control" id="titulo" value="Problemas com matrícula online">
      </div>

      <div class="mb-3">
        <label for="categoria" class="form-label">Categoria</label>
        <select class="form-select" id="categoria">
          <option selected>Administração</option>
          <option>Infraestrutura</option>
          <option>Docentes</option>
          <option>Serviços Acadêmicos</option>
          <option>Outros</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="universidade" class="form-label">Universidade</label>
        <select class="form-select" id="universidade">
          <option selected>@UFPI</option>
          <option>@UESPI</option>
          <option>@UFMA</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" rows="5">A plataforma de matrícula apresenta falhas constantes e não conclui a inscrição de alguns alunos.</textarea>
      </div>

      <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary">Republicar</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById("form-republicar").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Reclamação republicada com sucesso!");
      window.location.href = "telafeed.html";
    });
  </script>
</body>
</html>
